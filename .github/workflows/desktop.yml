name: Desktop (Windows)

# Aplikasi desktop Aset GA (Python + PySide6) dibangun menjadi exe portable di runner Windows.
on:
  push:
    paths:
      - "desktop/**"
      - ".github/workflows/desktop.yml"
  pull_request:
    paths:
      - "desktop/**"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    timeout-minutes: 30
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            desktop/requirements.txt
            desktop/requirements-dev.txt

      - name: Pasang dependensi
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Unit test (inti + uji asap antarmuka tanpa layar)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q tests

      - name: Tangkapan layar tampilan (data contoh)
        id: shots
        continue-on-error: true
        run: python tools/screenshots.py screenshots

      - name: Paketkan tangkapan layar (berisi GALAT.txt bila gagal)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path screenshots | Out-Null
          if (-not (Get-ChildItem screenshots)) { "Tidak ada tangkapan layar" | Set-Content screenshots/GALAT.txt }
          Compress-Archive -Path screenshots/* -DestinationPath "tampilan-${{ github.run_number }}.zip"

      - name: Tulis nomor build
        shell: pwsh
        run: (Get-Content asetga/__init__.py) -replace 'VERSION = "dev"', 'VERSION = "${{ github.run_number }}"' | Set-Content asetga/__init__.py

      - name: Build exe portable (PyInstaller, satu folder)
        run: >
          pyinstaller --noconfirm --clean --windowed --name AsetGA
          --icon asetga/resources/icon.ico
          --add-data "asetga/resources;asetga/resources"
          --collect-submodules reportlab.pdfbase
          --collect-submodules reportlab.graphics.barcode
          --collect-data reportlab
          run.py

      - name: Uji jalan exe (buka & tutup sendiri)
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          ASETGA_SMOKE_EXIT: "1"
          ASETGA_DATA_DIR: ${{ runner.temp }}\asetga-smoke
        run: |
          $p = Start-Process -FilePath dist/AsetGA/AsetGA.exe -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "AsetGA.exe keluar dengan kode $($p.ExitCode)" }
          if (-not (Test-Path "$env:ASETGA_DATA_DIR\aset_ga.db")) { throw "Database tidak dibuat" }
          if (-not (Test-Path "$env:ASETGA_DATA_DIR\uji-label.pdf")) { throw "Label PDF tidak dibuat" }
          if (-not (Test-Path "$env:ASETGA_DATA_DIR\uji-label.png")) { throw "Label PNG tidak dibuat" }

      - name: Paketkan zip
        shell: pwsh
        run: |
          Copy-Item README.md dist/AsetGA/BACA-SAYA.md
          Compress-Archive -Path dist/AsetGA -DestinationPath "AsetGA-desktop-${{ github.run_number }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: aset-ga-desktop
          path: |
            desktop/AsetGA-desktop-*.zip
            desktop/tampilan-*.zip

      - name: Terbitkan ke Releases
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $n = "${{ github.run_number }}"
          gh release create "desktop-$n" "AsetGA-desktop-$n.zip" "tampilan-$n.zip" --target "${{ github.sha }}" --prerelease `
            --title "Aset GA Desktop build $n (Windows)" `
            --notes "Aplikasi Windows portable dari commit ${{ github.sha }}. Unduh zip, ekstrak, lalu jalankan AsetGA.exe. Data tersimpan di folder data di samping AsetGA.exe."
