name: Build & Test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit test (domain + Room via Robolectric)
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build APK debug
        run: ./gradlew assembleDebug

      - name: Upload APK debug
        uses: actions/upload-artifact@v4
        with:
          name: aset-ga-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload laporan test
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/

  release:
    # Hanya berjalan bila secret keystore sudah diatur di Settings > Secrets and variables > Actions.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.ASETGA_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
        if: env.HAS_KEYSTORE == 'true'
      - uses: actions/setup-java@v4
        if: env.HAS_KEYSTORE == 'true'
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        if: env.HAS_KEYSTORE == 'true'
      - name: Build APK & AAB release
        if: env.HAS_KEYSTORE == 'true'
        env:
          ASETGA_KEYSTORE_PASSWORD: ${{ secrets.ASETGA_KEYSTORE_PASSWORD }}
          ASETGA_KEY_ALIAS: ${{ secrets.ASETGA_KEY_ALIAS }}
          ASETGA_KEY_PASSWORD: ${{ secrets.ASETGA_KEY_PASSWORD }}
          ASETGA_VERSION_CODE: ${{ github.run_number }}
        run: |
          echo "${{ secrets.ASETGA_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"
          export ASETGA_KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
          ./gradlew assembleRelease bundleRelease
      - uses: actions/upload-artifact@v4
        if: env.HAS_KEYSTORE == 'true'
        with:
          name: aset-ga-release
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
