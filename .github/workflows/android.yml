name: Build & Test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Semua APK debug harus ditandatangani kunci yang SAMA agar bisa di-update di HP tanpa uninstall.
      # Kunci disimpan di secret ASETGA_DEBUG_KEYSTORE_BASE64 (tidak pernah di-commit).
      - name: Pasang kunci debug tetap
        env:
          DEBUG_KEYSTORE: ${{ secrets.ASETGA_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE" ]; then
            mkdir -p ~/.android
            echo "$DEBUG_KEYSTORE" | base64 -d > ~/.android/debug.keystore
            echo "Kunci debug tetap dipakai."
          else
            echo "::warning::Secret ASETGA_DEBUG_KEYSTORE_BASE64 belum diisi. APK ditandatangani kunci acak dan TIDAK bisa meng-update versi sebelumnya."
          fi

      - name: Unit test (domain + Room via Robolectric)
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build APK debug
        env:
          # versionCode naik setiap build sehingga Android menerima APK baru sebagai update.
          ASETGA_VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew assembleDebug

      - name: Upload APK debug
        uses: actions/upload-artifact@v4
        with:
          name: aset-ga-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Terbitkan APK ke Releases (bisa diunduh dari GitHub Mobile)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          N=${{ github.run_number }}
          cp app/build/outputs/apk/debug/app-debug.apk "aset-ga-debug-$N.apk"
          gh release create "build-$N" "aset-ga-debug-$N.apk" \
            --target "${{ github.sha }}" --latest \
            --title "Aset GA build $N (debug)" \
            --notes "APK debug otomatis dari commit ${{ github.sha }}. Unduh file .apk di bawah lalu pasang di HP."

      - name: Upload laporan test
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/

  release:
    # Hanya berjalan bila secret keystore sudah diatur di Settings > Secrets and variables > Actions.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.ASETGA_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v5
        if: env.HAS_KEYSTORE == 'true'
      - uses: actions/setup-java@v5
        if: env.HAS_KEYSTORE == 'true'
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        if: env.HAS_KEYSTORE == 'true'
      - name: Build APK & AAB release
        if: env.HAS_KEYSTORE == 'true'
        env:
          ASETGA_KEYSTORE_PASSWORD: ${{ secrets.ASETGA_KEYSTORE_PASSWORD }}
          ASETGA_KEY_ALIAS: ${{ secrets.ASETGA_KEY_ALIAS }}
          ASETGA_KEY_PASSWORD: ${{ secrets.ASETGA_KEY_PASSWORD }}
          ASETGA_VERSION_CODE: ${{ github.run_number }}
        run: |
          echo "${{ secrets.ASETGA_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"
          export ASETGA_KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
          ./gradlew assembleRelease bundleRelease
      - uses: actions/upload-artifact@v4
        if: env.HAS_KEYSTORE == 'true'
        with:
          name: aset-ga-release
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
